# Stack de demonstração/dev: MySQL + API (:3001) + Web (:3000).
# Uso:
#   docker compose up -d --build
#   # API aplica migrations + seed no start; ver README (§ container).
# O MySQL do container NÃO é exposto ao host (evita conflito com o MySQL local).
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: expagrolab_dev
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql-data:/var/lib/mysql

  # Storage S3-compatível para fotos/anexos (Demanda E). Console em :9001.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  # Cria o bucket público uma vez e sai.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 minioadmin minioadmin &&
             mc mb --ignore-existing local/expagrolab &&
             mc anonymous set download local/expagrolab"

  api:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:3001
    environment:
      DATABASE_URL: mysql://root:root@mysql:3306/expagrolab_dev
      SHADOW_DATABASE_URL: mysql://root:root@mysql:3306/expagrolab_dev
      PORT: "3001"
      JWT_SECRET: dev-container-secret
      JWT_EXPIRES: 15m
      JWT_REFRESH_EXPIRES: 30d
      EMAIL_ENABLED: "true"
      SIMULATE_SEND: "true"
      SIMULATE_OUTPUT_DIR: /app/apps/api/email-previews
      EMAIL_BASE_URL: http://localhost:3000
      LOG_JSON: "true"
      # Storage (MinIO): endpoint interno p/ upload, base pública p/ URL no <img>.
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_BASE: http://localhost:9000
      S3_BUCKET: expagrolab
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
    # migrate + seed idempotentes no start, depois sobe a API.
    command: >
      sh -c "pnpm --filter @exp/api exec prisma migrate deploy &&
             pnpm --filter @exp/api db:seed &&
             node apps/api/dist/main.js"
    ports:
      - "3001:3001"
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:3001
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:3001
    command: pnpm --filter @exp/web start
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  mysql-data:
  minio-data:
